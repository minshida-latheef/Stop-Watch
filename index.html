<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stopwatch-container">

        <div class="stopwatch-card">
            <h1>STOPWATCH</h1>

            <div class="time-display" id="timeDisplay">
                00:00:00:00
            </div>

            <div class="buttons">
                <button id="startBtn" class="btn start">Start</button>
                <button id="pauseBtn" class="btn pause" disabled>Pause</button>
                <button id="lapBtn" class="btn lap" disabled>Lap</button>
                <button id="resetBtn" class="btn reset">Reset</button>
            </div>

            <div class="laps-section">
                <div class="laps-header">
                    <h2>Lap Times</h2>
                    <button id="clearLapsBtn" disabled>Clear</button>
                </div>

                <ul id="lapList"></ul>
            </div>

            <p class="shortcuts">
                <span>Space</span> Start/Pause
                <span>R</span> Reset
                <span>L</span> Lap
            </p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
